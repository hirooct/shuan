<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    :root{--bg:#f3f6fa;--panel:#fff;--line:#dbe3ec;--text:#172033;--muted:#64748b;--blue:#2563eb;--blueSoft:#eaf1ff;--green:#059669;--orange:#ea580c;--purple:#7c3aed;--shadow:0 8px 28px rgba(15,23,42,.08)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}button,input,textarea,select{font:inherit}button{touch-action:manipulation}
    body{overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    .app{height:100%;display:grid;grid-template-columns:210px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr);grid-template-areas:'side top' 'side main'}
    .side{grid-area:side;background:#111827;color:white;padding:16px 11px;display:flex;flex-direction:column;gap:7px}.brand{padding:5px 10px 16px}.brand strong{display:block;font-size:19px}.brand small{color:#94a3b8}.nav{border:0;background:transparent;color:#cbd5e1;text-decoration:none;border-radius:13px;min-height:48px;padding:0 13px;display:flex;align-items:center;gap:9px;font-weight:800;text-align:left}.nav.active{background:white;color:#111827}.spacer{flex:1}
    .top{grid-area:top;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:10px}.top-left,.week-nav,.top-actions{display:flex;align-items:center;gap:7px}.title{font-size:19px;font-weight:900}.week-nav button,.week-nav select,.btn{border:1px solid var(--line);background:white;border-radius:11px;min-height:40px;padding:0 11px;font-weight:800}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.tools{background:#0f766e;color:white;border-color:#0f766e}.btn:disabled{opacity:.45}.save-state{font-size:11px;color:var(--muted)}
    .main{grid-area:main;overflow:auto;min-width:0;min-height:0;padding:13px;overscroll-behavior:contain}.meta{font-size:12px;color:var(--muted);margin:0 0 9px 2px}.day-strip{display:flex;gap:7px;overflow:auto;padding:2px 0 11px;scrollbar-width:none}.day-strip::-webkit-scrollbar{display:none}.day{flex:0 0 auto;min-width:88px;border:1px solid var(--line);background:white;border-radius:14px;padding:9px 11px;font-weight:900}.day span{display:block;font-size:11px;color:var(--muted);margin-top:2px}.day.active{background:var(--blueSoft);border-color:#b9ccff;color:#1d4ed8}.day.holiday{opacity:.5}
    .quickbar{display:flex;gap:7px;overflow:auto;padding-bottom:11px;scrollbar-width:none}.quickbar button{flex:0 0 auto;min-height:40px;border:0;border-radius:12px;padding:0 12px;font-weight:800;color:white}.q-default{background:#d97706}.q-change{background:#0f766e}.q-copy{background:#475569}.q-phrase{background:#7c3aed}.q-event{background:#db2777}.q-print{background:#0284c7}
    .grid{display:grid;grid-template-columns:minmax(430px,1.2fr) minmax(300px,.8fr);gap:13px;align-items:start}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:var(--shadow)}.card h2{font-size:16px;margin:0 0 11px}.stack{display:grid;gap:9px}.field label{display:block;font-size:11px;color:#526074;font-weight:800;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;background:#fbfdff;padding:10px;color:var(--text)}.field textarea{min-height:78px;resize:vertical;line-height:1.5}.mini{display:grid;grid-template-columns:1fr 1fr;gap:9px}.period{border:1px solid var(--line);border-radius:14px;padding:10px}.period-head{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:7px}.period-no{width:40px;height:40px;border-radius:11px;background:#eef2f7;display:grid;place-items:center;font-weight:900}.subject-row{display:grid;grid-template-columns:minmax(0,1fr) 42px;gap:5px}.subject-row select{padding:0 3px}.readonly{background:#f1f5f9!important;color:#64748b!important}.note textarea{min-height:108px}
    .overlay{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.modal{width:min(560px,94vw);max-height:86vh;overflow:auto;background:white;border-radius:20px;padding:18px;box-shadow:0 22px 60px rgba(0,0,0,.25)}.modal h3{margin:0 0 14px;font-size:18px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.modal-actions button{min-height:44px;border-radius:11px;border:1px solid var(--line);padding:0 15px;font-weight:800}.modal-actions .ok{background:var(--blue);color:white;border-color:var(--blue)}.phrase-list{display:grid;gap:8px}.phrase{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;text-align:left}.phrase strong{display:block}.phrase small{display:block;color:var(--muted);white-space:pre-wrap;margin-top:3px}.pattern-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.loading{position:fixed;inset:0;background:rgba(248,250,252,.84);z-index:200;display:grid;place-items:center;font-weight:900}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:white;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:250}.toast.show{opacity:1}.bottom{display:none}
    @media(orientation:portrait) and (max-width:1100px){.app{grid-template-columns:1fr;grid-template-rows:58px minmax(0,1fr) 70px;grid-template-areas:'top' 'main' 'bottom'}.side{display:none}.grid{grid-template-columns:1fr}.main{padding:11px}.title{font-size:17px}.save-state{display:none}.bottom{grid-area:bottom;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line)}.bottom a,.bottom button{border:0;background:transparent;color:#64748b;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:800}.bottom .active{color:var(--blue)}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand"><strong><?= appName ?></strong><small>iPad Edition</small></div><button class="nav active">📅 週案</button><a class="nav" href="<?= getScriptUrl(); ?>?p=tsushin">📰 学級通信</a><a class="nav" href="<?= getScriptUrl(); ?>?p=setting">⚙️ 設定</a><div class="spacer"></div><a class="nav" href="<?= getScriptUrl(); ?>?p=WeeklyPrint">🖨️ A4週案</a><a class="nav" href="<?= getScriptUrl(); ?>">🏠 ホーム</a></aside>
  <header class="top"><div class="top-left"><div class="title">週案</div><div class="week-nav"><button onclick="changeWeek(-1)">◀</button><select id="weekSelect" onchange="selectWeek(this.value)"></select><button onclick="changeWeek(1)">▶</button></div></div><div class="top-actions"><span class="save-state" id="saveState">読込中</span><button class="btn tools" onclick="openTools()">ツール</button><button class="btn primary" id="saveBtn" onclick="saveWeek()" disabled>保存</button></div></header>
  <main class="main"><div class="meta" id="meta"></div><div class="day-strip" id="dayStrip"></div><div class="quickbar"><button class="q-default" onclick="applyDefault()">📅 基本時間割</button><button class="q-change" onclick="openTimetable()">🔁 時間割変更</button><button class="q-copy" onclick="copyPrevious()">📋 前週コピー</button><button class="q-phrase" onclick="openPhrases()">✍️ 定型文</button><button class="q-event" onclick="openEvent()">✨ 行事登録</button><button class="q-print" onclick="location.href=SCRIPT_URL+'?p=WeeklyPrint'">🖨️ A4表示</button></div>
    <div class="grid"><section class="card"><h2 id="dayTitle">授業</h2><div class="stack" id="lessonArea"></div></section><section class="stack"><div class="card"><h2>1日の予定・生活</h2><div class="stack"><div class="field"><label>行事</label><input id="f-event" class="readonly" readonly></div><div class="field"><label>朝</label><input id="f-morning"></div><div class="mini"><div class="field"><label>中間休み</label><input id="f-rest"></div><div class="field"><label>給食</label><input id="f-lunch"></div><div class="field"><label>そうじ</label><input id="f-clean"></div><div class="field"><label>昼休み</label><input id="f-recess"></div></div><div class="field"><label>下校</label><input id="f-leaving" list="leavingList"><datalist id="leavingList"></datalist></div></div></div><div class="card note"><h2>宿題・備考</h2><div class="stack"><div class="field"><label>宿題</label><textarea id="f-homework"></textarea></div><div class="field"><label>備考・交換授業・準備</label><textarea id="f-memo"></textarea></div></div></div></section></div>
  </main>
  <nav class="bottom"><button class="active">📅<span>週案</span></button><button onclick="openTools()">🧰<span>ツール</span></button><a href="<?= getScriptUrl(); ?>?p=tsushin">📰<span>通信</span></a><a href="<?= getScriptUrl(); ?>?p=setting">⚙️<span>設定</span></a></nav>
</div>
<div class="loading" id="loading">週案を読み込んでいます…</div><div class="toast" id="toast"></div>

<div class="overlay" id="phraseModal"><div class="modal"><h3>定型文を挿入</h3><div class="field"><label>挿入先</label><select id="phraseTarget"><option value="homework">宿題</option><option value="memo">備考</option><option value="content">現在の時間の学習内容</option></select></div><div class="phrase-list" id="phraseList"></div><div class="modal-actions"><button onclick="closeModal('phraseModal')">閉じる</button></div></div></div>

<div class="overlay" id="eventModal"><div class="modal"><h3>休日・行事登録</h3><div class="stack"><div class="field"><label>種別</label><select id="eventType"><option value="event">行事</option><option value="holiday">休日</option></select></div><div class="field"><label>日付</label><input id="eventDate" type="date"></div><div class="field"><label>名称</label><input id="eventName" placeholder="例：水泳、クラブ、祝日"></div></div><div class="modal-actions"><button onclick="closeModal('eventModal')">キャンセル</button><button class="ok" onclick="registerEvent()">登録</button></div></div></div>

<div class="overlay" id="timetableModal"><div class="modal"><h3>時間割をまとめて変更</h3><div class="stack"><div class="field"><label>登録パターン</label><select id="patternSelect" onchange="loadPattern()"><option value="">手動で指定</option></select></div><div class="pattern-row"><div class="field"><label>変更する日</label><select id="targetDay"><option value="0">月</option><option value="1">火</option><option value="2">水</option><option value="3">木</option><option value="4">金</option></select></div><div class="field"><label>元にする曜日</label><select id="sourceDay"><option value="0">月曜</option><option value="1">火曜</option><option value="2">水曜</option><option value="3">木曜</option><option value="4">金曜</option></select></div></div><div class="pattern-row"><div class="field"><label>元の開始</label><select id="sourceStart"></select></div><div class="field"><label>元の終了</label><select id="sourceEnd"></select></div></div><div class="field"><label>変更先の開始</label><select id="targetStart"></select></div><label style="font-size:13px"><input type="checkbox" id="overwrite" checked> 変更先に入力済みでも上書きする</label></div><div class="modal-actions"><button onclick="closeModal('timetableModal')">キャンセル</button><button class="ok" onclick="applyTimetable()">反映</button></div></div></div>

<div class="overlay" id="toolsModal"><div class="modal"><h3>週案ツール</h3><div class="stack"><button class="phrase" onclick="closeModal('toolsModal');applyDefault()"><strong>📅 基本時間割を読み込む</strong><small>設定済みの基本時間割を月〜金へ反映</small></button><button class="phrase" onclick="closeModal('toolsModal');openTimetable()"><strong>🔁 時間割をまとめて変更</strong><small>交換授業や短縮時程などに対応</small></button><button class="phrase" onclick="closeModal('toolsModal');copyPrevious()"><strong>📋 前週から作成</strong><small>前週の入力内容を現在の週へコピー</small></button><button class="phrase" onclick="closeModal('toolsModal');openPhrases()"><strong>✍️ 定型文</strong><small>挿入先を選んでワンタップ挿入</small></button><button class="phrase" onclick="closeModal('toolsModal');openEvent()"><strong>✨ 休日・行事登録</strong><small>登録後、週案を自動再読込</small></button></div><div class="modal-actions"><button onclick="closeModal('toolsModal')">閉じる</button></div></div></div>

<script>
const SCRIPT_URL='<?= getScriptUrl(); ?>';let data=null,week=1,day=0,dirty=false,productivity={patterns:[],phrases:[]},defaultTimetable={},draftTimer=null,lastPeriod=1;
const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}function closeModal(id){$(id).classList.remove('show')}function showModal(id){$(id).classList.add('show')}
function setDirty(v){dirty=v;$('saveBtn').disabled=!v;$('saveState').textContent=v?'未保存':'保存済み'}
function init(){for(let i=1;i<=52;i++)$('weekSelect').add(new Option('第 '+i+'週',i));for(let i=1;i<=6;i++){$('sourceStart').add(new Option(i+'時間目',i));$('sourceEnd').add(new Option(i+'時間目',i));$('targetStart').add(new Option(i+'時間目',i))}$('sourceEnd').value='6';google.script.run.withSuccessHandler(initial=>{week=Number(initial.weekNum||1);productivity=initial.productivity||productivity;defaultTimetable=initial.defaultTimetable||{};render(initial.weekly);offerDraft(initial.draft);draftTimer=setInterval(saveDraft,60000)}).withFailureHandler(loadError).getWeeklyPageInitialData()}
function loadError(e){$('loading').textContent='読み込みに失敗しました: '+(e&&e.message?e.message:e)}
function render(d){if(!d||d.error){loadError({message:d&&d.error?d.error:'データを取得できませんでした'});return}data=d;week=Number(d.weekNum||week);$('weekSelect').value=week;$('meta').textContent=[d.year+'年度',d.schoolName,d.className,d.teacherName,d.startDate+'〜'+d.endDate].filter(Boolean).join('　');$('leavingList').innerHTML=(d.leavingTimes||[]).map(v=>'<option value="'+esc(v)+'"></option>').join('');renderDays();renderDay();$('loading').style.display='none';setDirty(false)}
function renderDays(){const s=$('dayStrip');s.innerHTML='';data.days.forEach((label,i)=>{const b=document.createElement('button');b.className='day'+(i===day?' active':'')+((data.holidayRow[i]||'').includes('休')?' holiday':'');const m=label.match(/\((.)\)/);b.innerHTML=(m?m[1]:'')+'<span>'+label.replace(/\(.+\)/,'')+'</span>';b.onclick=()=>switchDay(i);s.appendChild(b)})}
function opts(sel){return '<option value=""></option>'+(data.dropdownSubjects||[]).map(x=>'<option value="'+esc(x)+'"'+(x===sel?' selected':'')+'>'+esc(x)+'</option>').join('')}
function renderDay(){const t=data.timetable,i=day;$('dayTitle').textContent=data.days[i]+' の授業';['event','morning','rest','lunch','clean','recess','leaving','homework','memo'].forEach(k=>{const el=$('f-'+k);if(el)el.value=(t[k]&&t[k][i])||''});const area=$('lessonArea');area.innerHTML='';for(let p=1;p<=6;p++){const c=(t['p'+p]&&t['p'+p][i])||{subject:'',content:''},box=document.createElement('div');box.className='period';box.innerHTML='<div class="period-head"><div class="period-no">'+p+'</div><div class="subject-row"><input id="sub-'+p+'" value="'+esc(c.subject)+'" placeholder="教科" onfocus="lastPeriod='+p+'"><select onchange="$(\'sub-'+p+'\').value=this.value;mark()">'+opts(c.subject)+'</select></div></div><div class="field"><textarea id="cont-'+p+'" placeholder="学習内容・準備・指導メモ" onfocus="lastPeriod='+p+'">'+esc(c.content)+'</textarea></div>';area.appendChild(box)}const holiday=(data.holidayRow[i]||'').includes('休');area.querySelectorAll('input,textarea,select').forEach(e=>e.disabled=holiday);['f-morning','f-rest','f-lunch','f-clean','f-recess','f-leaving','f-homework','f-memo'].forEach(id=>$(id).disabled=holiday);document.querySelectorAll('.main input:not([readonly]),.main textarea,.main select').forEach(e=>e.oninput=mark)}
function mark(){setDirty(true)}function flushDay(){if(!data)return;const t=data.timetable,i=day;['morning','rest','lunch','clean','recess','leaving','homework','memo'].forEach(k=>t[k][i]=$('f-'+k).value);for(let p=1;p<=6;p++)t['p'+p][i]={subject:$('sub-'+p)?.value||'',content:$('cont-'+p)?.value||''}}
function switchDay(i){flushDay();day=i;renderDays();renderDay()}function clientData(){flushDay();const t=data.timetable;return{morning:t.morning,p1:t.p1,p2:t.p2,rest:t.rest,p3:t.p3,p4:t.p4,lunch:t.lunch,clean:t.clean,recess:t.recess,p5:t.p5,p6:t.p6,leaving:t.leaving,homework:t.homework,memo:t.memo}}
function saveWeek(){if(!data)return;const b=$('saveBtn');b.disabled=true;$('saveState').textContent='保存中…';google.script.run.withSuccessHandler(r=>{if(r&&r.error){alert(r.error);b.disabled=false;return}setDirty(false);toast('保存しました')}).withFailureHandler(e=>{alert('保存に失敗しました: '+(e&&e.message?e.message:e));b.disabled=false}).saveWeeklyData(week,data.colIndices,clientData())}
function selectWeek(v){const n=Number(v);if(n===week)return;if(dirty&&!confirm('未保存の変更があります。週を移動しますか？')){$('weekSelect').value=week;return}loadWeek(n)}function changeWeek(o){selectWeek(Math.max(1,Math.min(52,week+o)))}function loadWeek(n){$('loading').style.display='grid';$('loading').textContent='週案を読み込んでいます…';google.script.run.withSuccessHandler(p=>{week=n;day=0;render(p.weekly||p);offerDraft(p.draft)}).withFailureHandler(loadError).getWeeklyPageData(n)}
function applyDefault(){flushDay();if(!confirm('月〜金の教科を基本時間割で置き換えますか？\n学習内容は残します。'))return;for(let p=1;p<=6;p++){const key='p'+p;for(let d=0;d<5;d++){if(!data.timetable[key][d])data.timetable[key][d]={subject:'',content:''};data.timetable[key][d].subject=(defaultTimetable[key]&&defaultTimetable[key][d])||''}}renderDay();setDirty(true);toast('基本時間割を反映しました')}
function copyPrevious(){if(week<=1){alert('前週がありません。');return}if(!confirm('第'+(week-1)+'週の内容を現在の週へコピーしますか？'))return;$('loading').style.display='grid';google.script.run.withSuccessHandler(p=>{const src=(p.weekly||p).timetable;['morning','rest','lunch','clean','recess','leaving','homework','memo'].forEach(k=>data.timetable[k]=JSON.parse(JSON.stringify(src[k]||[])));for(let x=1;x<=6;x++)data.timetable['p'+x]=JSON.parse(JSON.stringify(src['p'+x]||[]));$('loading').style.display='none';renderDay();setDirty(true);toast('前週からコピーしました')}).withFailureHandler(loadError).getWeeklyPageData(week-1)}
function openPhrases(){const list=$('phraseList');list.innerHTML='';(productivity.phrases||[]).forEach(ph=>{const b=document.createElement('button');b.className='phrase';b.innerHTML='<strong>'+esc(ph.name)+'</strong><small>'+esc(ph.text)+'</small>';b.onclick=()=>insertPhrase(ph.text);list.appendChild(b)});if(!list.children.length)list.innerHTML='<div class="muted">定型文がありません。設定ページで登録できます。</div>';showModal('phraseModal')}
function insertPhrase(text){let target=$('phraseTarget').value,el=target==='homework'?$('f-homework'):target==='memo'?$('f-memo'):$('cont-'+lastPeriod);if(!el){alert('挿入先が見つかりません。');return}const start=el.selectionStart??el.value.length,end=el.selectionEnd??start,before=el.value.slice(0,start),after=el.value.slice(end),sep=before&&before.slice(-1)!=='\n'?'\n':'';el.value=before+sep+text+after;mark();closeModal('phraseModal');el.focus();toast('定型文を挿入しました')}
function openEvent(){const n=new Date(),d=[n.getFullYear(),String(n.getMonth()+1).padStart(2,'0'),String(n.getDate()).padStart(2,'0')].join('-');$('eventDate').value=d;$('eventName').value='';showModal('eventModal')}function registerEvent(){const type=$('eventType').value,date=$('eventDate').value,name=$('eventName').value.trim();if(!date||!name){alert('日付と名称を入力してください。');return}$('loading').style.display='grid';google.script.run.withSuccessHandler(r=>{if(r&&r.error){$('loading').style.display='none';alert(r.error);return}closeModal('eventModal');toast(r.message||'登録しました');loadWeek(week)}).withFailureHandler(loadError).addNewConfigEventOrHoliday(type,date,name)}
function openTimetable(){const s=$('patternSelect');s.innerHTML='<option value="">手動で指定</option>';(productivity.patterns||[]).forEach((p,i)=>s.add(new Option(p.name||('パターン'+(i+1)),i)));$('targetDay').value=day<5?day:0;showModal('timetableModal')}function loadPattern(){const v=$('patternSelect').value;if(v==='')return;const p=productivity.patterns[Number(v)];$('sourceDay').value=p.sourceDay;$('sourceStart').value=p.sourceStart;$('sourceEnd').value=p.sourceEnd;$('targetStart').value=p.targetStart;$('overwrite').checked=p.overwrite!==false}
function applyTimetable(){flushDay();const sd=+$('sourceDay').value,td=+$('targetDay').value,ss=+$('sourceStart').value,se=+$('sourceEnd').value,ts=+$('targetStart').value,ow=$('overwrite').checked;if(se<ss){alert('元の終了時間を確認してください。');return}let offset=0;for(let p=ss;p<=se;p++,offset++){const dest=ts+offset;if(dest>6)break;const src=JSON.parse(JSON.stringify(data.timetable['p'+p][sd]||{subject:'',content:''})),cur=data.timetable['p'+dest][td]||{subject:'',content:''};if(ow||(!cur.subject&&!cur.content))data.timetable['p'+dest][td]=src}day=td;closeModal('timetableModal');renderDays();renderDay();setDirty(true);toast('時間割を変更しました')}
function openTools(){showModal('toolsModal')}function saveDraft(){if(!dirty||!data)return;google.script.run.saveWeeklyDraft(week,clientData())}function offerDraft(d){if(!d||!d.data)return;const when=d.savedAt?new Date(d.savedAt).toLocaleString('ja-JP'):'';if(confirm('未保存の下書き'+(when?'（'+when+'）':'')+'があります。復元しますか？')){const src=d.data;Object.keys(src).forEach(k=>{if(data.timetable[k])data.timetable[k]=JSON.parse(JSON.stringify(src[k]))});renderDay();setDirty(true)}}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});window.addEventListener('load',init);
</script>
