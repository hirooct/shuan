<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>学級通信作成Webアプリ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  body { 
    margin: 0; 
    font-family: "BIZ UDPMincho", "Hiragino Mincho ProN", "MS Mincho", serif; 
    background: #eef2f7; 
    color: #222; 
  }
  .app { display: grid; grid-template-columns: 360px 1fr; min-height: 100vh; }
  
  .side { background: #fff; padding: 24px; border-right: 1px solid #d8dee8; height: 100vh; overflow-y: auto; position: sticky; top: 0; font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif; }
  .side h1 { font-size: 18px; color: var(--theme-color, #1f3a5f); margin-top: 0; margin-bottom: 20px; border-bottom: 2px solid var(--theme-color, #1f3a5f); padding-bottom: 8px; transition: all 0.3s; }
  .panel { margin-bottom: 20px; padding: 16px; border: 1px solid #dde5f0; border-radius: 12px; background: #f8fbff; }
  label { display: block; font-weight: bold; font-size: 13px; margin: 12px 0 6px; color: #334155; }
  input, textarea, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: #fff; font-family: inherit; }
  
  textarea { min-height: 120px; line-height: 1.6; resize: vertical; }
  /* 今週のひとこま用は少し広めに */
  #columnBody { min-height: 200px; }
  
  .qr-edit-group { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .qr-edit-group input[type="text"] { flex-grow: 1; }
  .qr-edit-group label { margin: 0; display: flex; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap; cursor: pointer; }
  .qr-edit-group input[type="checkbox"] { width: auto; cursor: pointer; }

  /* トピックス写真設定用のボックステキスト */
  .sub-panel-box { margin-top: 10px; padding: 10px; border: 1px dashed #cbd5e1; border-radius: 8px; background: #fff; }

  .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .saveBtn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; background: #2e7d32; color: white; transition: background 0.2s; font-family: inherit; }
  .saveBtn:hover { filter: brightness(0.85); }
  .secondaryBtn { width: 100%; padding: 11px; border: 1px solid #64748b; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; background: #fff; color: #334155; font-family: inherit; }
  .secondaryBtn:hover { background: #f1f5f9; }
  .photoRemoveBtn { margin-top: 6px; padding: 7px 10px; border: 1px solid #b91c1c; border-radius: 8px; background: #fff; color: #b91c1c; cursor: pointer; font-weight: bold; }
  .printBtn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; background: var(--theme-color, #1f4d8f); color: white; transition: background 0.2s; font-family: inherit; }
  .printBtn:hover { filter: brightness(0.85); }
  
  .previewWrap { padding: 28px; overflow: auto; display: flex; justify-content: center; }
  .paper { width: 210mm; height: 297mm; background: white; padding: 10mm 13mm; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
  
  .topHeader { border: 2px solid var(--theme-color, #1f3a5f); background: var(--bg-color, #e8eef7); padding: 8px 14px; border-radius: 6px; margin-bottom: 12px; }
  .titleRow { display: flex; justify-content: space-between; align-items: center; }
  .mainTitle { font-size: 26px; font-weight: 900; color: var(--theme-color, #1f3a5f); letter-spacing: 2px; font-family: sans-serif; }
  .issue { font-size: 14px; font-weight: bold; border: 2px solid var(--theme-color, #1f3a5f); padding: 2px 12px; border-radius: 999px; background: #fff; font-family: "BIZ UDGothic", sans-serif; }
  .meta { margin-top: 4px; text-align: right; font-size: 11px; color: #475569; border-top: 1px dashed var(--theme-color, #1f3a5f); padding-top: 3px; font-family: "BIZ UDGothic", sans-serif; }
  
  .sectionTitle { margin: 8px 0 4px; padding: 4px 10px; background: var(--theme-color, #1f3a5f); color: white; font-size: 16px; font-weight: bold; border-radius: 4px; font-family: "BIZ UDGothic", sans-serif; }
  .sectionSubNote { font-size: 10px; color: #555; margin: -4px 4px 2px 0; font-weight: bold; text-align: right; font-family: "BIZ UDGothic", sans-serif; }

  /* 2列（写真あり）コラム用スタイル */
  .columnBox { 
    display: grid; 
    grid-template-columns: 40% 1fr; 
    gap: 12px; 
    border: 1.5px solid var(--theme-color, #1f3a5f); 
    padding: 8px; 
    border-radius: 6px; 
    background: #fff; 
    margin-bottom: 4px;
    align-items: center; 
  }
  /* 1列（写真なし）コラム用スタイル */
  .columnBox.no-photo {
    display: block;
  }

  .photoContainer { display: flex; flex-direction: column; gap: 4px; width: 100%; }
  .photoSpace { min-height: 160px; height: 160px; border: 1px dashed #94a3b8; background: #f8fafc; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px; position: relative; font-family: "BIZ UDGothic", sans-serif; }
  .photoSpace.has-photo { border: none; }
  .photoSpace img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.1s ease-out; transform-origin: center; }
  .photoHint { color: #64748b; font-size: 12px; }
  .photoCaption { font-size: 10px; color: #475569; line-height: 1.3; text-align: center; font-family: "BIZ UDGothic", sans-serif; white-space: pre-wrap; }
  .photoCaption:empty { display: none; }

  .columnText h2 { margin: 0 0 4px; font-size: 14px; color: var(--theme-color, #1f3a5f); border-bottom: 1px solid #cbd5e1; padding-bottom: 2px; font-family: "BIZ UDGothic", sans-serif; }
  .columnText p { margin: 0; font-size: 13px; line-height: 1.5; white-space: pre-wrap; color: #222; }
  
  /* 高さ自動調整のため、flex-grow を削除して中身に合わせる形に調整 */
  .freeColumnBox { border: 1.5px solid var(--theme-color, #1f3a5f); padding: 10px 12px; border-radius: 6px; background: #fff; }
  .freeColumnBox h2 { margin: 0 0 4px; font-size: 13.5px; color: var(--theme-color, #1f3a5f); border-bottom: 1px dashed #cbd5e1; padding-bottom: 2px; font-family: "BIZ UDGothic", sans-serif; }
  .freeColumnBox p { margin: 0; font-size: 13px; line-height: 1.5; white-space: pre-wrap; color: #222; }

  #nextWeekTable { flex-grow: 1; margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-weight: bold; table-layout: fixed; background: #fff; font-family: "BIZ UDGothic", sans-serif; }
  th { background: var(--bg-color, #e8eef7); color: var(--theme-color, #1f3a5f); font-weight: bold; }
  th, td { border: 1px solid #9aa8ba; padding: 3px 1px; vertical-align: middle; text-align: center; word-break: break-all; line-height: 1.3; height: 1px; } 
  .row-label { width: 45px; font-weight: bold; background: #f8fafc; font-size: 12px; }
  
  .event-cell { background-color: #fff; }
  .period-cell { background-color: #fff; } 
  .dismissal-cell { background-color: #e2e8f0 !important; color: #0f172a !important; font-weight: 700 !important; } 
  .homework-cell { background-color: #f8fafc !important; text-align: left !important; padding-left: 5px !important; white-space: pre-wrap; } 
  .holiday-col { background-color: var(--bg-color, #e8eef7) !important; color: #71717a !important; font-weight: normal !important; }
  
  .event-cell { white-space: nowrap !important; overflow: hidden !important; text-overflow: clip !important; padding: 3px 2px !important; }
  .event-text { display: inline-block; white-space: nowrap; font-size: 13px; transform-origin: center center; }
  .suiei-highlight { background-color: #e0f2f1 !important; color: #00796b !important; font-weight: bold !important; }
  
  .noticeBox { border: 1.5px solid var(--theme-color, #1f3a5f); border-radius: 6px; padding: 8px 12px; background: #fff; margin-bottom: 2px; }
  .noticeList { font-size: 13px; line-height: 1.5; margin: 0; padding-left: 18px; color: #222; }
  .noticeList li { margin-bottom: 4px; }

  .bottom-layout { display: grid; grid-template-columns: 72% 1fr; gap: 12px; align-items: stretch; margin-top: 6px; flex-grow: 1; }
  .bottom-left-table { display: flex; flex-direction: column; height: 100%; flex-grow: 1; }
  #followingWeekTable { flex-grow: 1; }
  
  .bottom-right-panel { display: flex; flex-direction: column; gap: 6px; margin-top: 0; height: 100%; } 
  .duty-box { border: 1.5px solid var(--theme-color, #1f3a5f); border-radius: 6px; padding: 5px; text-align: center; background: #fff; transition: background-color 0.2s; }
  .duty-box.hide-duty { display: none !important; }
  .duty-title { font-size: 13px; font-weight: bold; color: #64748b; margin-bottom: 3px; font-family: "BIZ UDGothic", sans-serif; }
  .duty-value { font-size: 24px; font-weight: 700; color: var(--theme-color, #1f3a5f); font-family: "BIZ UDGothic", sans-serif; }
  .duty-box.duty-a { background-color: #ffebee !important; }
  .duty-box.duty-b { background-color: #fffde7 !important; }

  .qr-container { display: flex; flex-direction: column; justify-content: space-around; flex-grow: 1; border: 1.5px solid var(--theme-color, #1f3a5f); border-radius: 6px; padding: 8px 6px; background: #fff; }
  .qr-block { text-align: center; padding: 4px 0; }
  .qr-block.qr-hide { display: none !important; } 
  .qr-block:first-child:not(.qr-hide) { border-bottom: 1px dashed #cbd5e1; padding-bottom: 8px; }
  .qr-label { font-size: 13px; font-weight: bold; color: #475569; margin-bottom: 4px; font-family: "BIZ UDGothic", sans-serif; }
  .qr-code img { width: 50px; height: 50px; object-fit: contain; display: block; margin: 0 auto; }
  .qr-note { font-size: 8px; font-weight: bold; color: #e11d48; text-align: center; margin-top: 4px; padding-top: 4px; border-top: 1px dashed #cbd5e1; white-space: nowrap; font-family: "BIZ UDGothic", sans-serif; }
  .qr-container.qr-all-hide { display: none !important; } 

  .hidden-input { display: none !important; }
  .archiveModal { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(15,23,42,.55); align-items: center; justify-content: center; padding: 20px; font-family: "Helvetica Neue", Arial, "Meiryo", sans-serif; }
  .archiveModal.open { display: flex; }
  .archiveDialog { width: min(720px, 96vw); max-height: 82vh; overflow: auto; background: #fff; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.3); padding: 20px; }
  .archiveHeader { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  .archiveHeader h2 { margin: 0; font-size: 19px; color: #1e3a8a; }
  .archiveClose { border: 0; background: #e2e8f0; border-radius: 999px; width: 34px; height: 34px; cursor: pointer; font-size: 18px; }
  .archiveItem { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px; border: 1px solid #dbe4ef; border-radius: 10px; margin-bottom: 8px; }
  .archiveMeta { font-size: 12px; color: #64748b; margin-top: 4px; }
  .archiveLoadBtn { border: 0; border-radius: 8px; padding: 9px 13px; background: #1e3a8a; color: #fff; cursor: pointer; font-weight: bold; }

  @media print {
    body { background: white; }
    .side { display: none; }
    .app { display: block; }
    .previewWrap { padding: 0; overflow: visible; }
    .paper { width: 210mm; height: 297mm; margin: 0; padding: 10mm 13mm; box-shadow: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { size: A4 portrait; margin: 0; }
  }
</style>
</head>

<body>
<div class="app">

  <aside class="side">
    <h1>学級通信作成Webアプリ</h1>
    
    <div class="panel">
      <label for="mainTitleInput">学級通信タイトル</label>
      <input id="mainTitleInput" value="学級通信 Team6の3">
      <label for="issueInput">号数</label>
      <input id="issueInput" value="第11号">
      <label for="dateInput">発行日</label>
      <input id="dateInput" value="令和8年5月29日">
      <label for="classInput">学校・学級</label>
      <input id="classInput" value="御国野小学校 6年3組">
    </div>

    <!-- 今週のひとこま設定パネル -->
    <div class="panel">
      <label style="color: #1e3a8a; font-size: 14px;">▼ 今週のひとこま設定</label>
      <label for="photoInput">写真を入れる</label>
      <input type="file" id="photoInput" accept="image/*">
      <button type="button" class="photoRemoveBtn" onclick="removeMainPhoto()">写真を外す</button>
      <label for="photoCaptionInput">写真の説明（キャプション）</label>
      <input id="photoCaptionInput" value="" placeholder="例：マット運動の様子（5/25）">
      <label>写真の調整</label>
      <input type="range" id="zoomRange" min="1" max="3" step="0.05" value="1">
      <input type="range" id="xPosRange" min="-150" max="150" step="1" value="0">
      <input type="range" id="yPosRange" min="-150" max="150" step="1" value="0">
      <hr style="border:0; border-top:1px solid #cbd5e1; margin:14px 0;">
      <label for="columnTitle">タイトル</label>
      <input id="columnTitle" value="マット運動がんばりました。">
      <label for="columnBody">本文</label>
      <textarea id="columnBody">「どうすれば回ってピタッと止まることができるか」を学習課題として、前転や後転だけでなく、開脚前転・開脚後転、側転、ロンダートなどにも挑戦しました。</textarea>
    </div>

    <!-- 上段エリア（トピックス）設定パネル -->
    <div class="panel">
      <label for="upperTypeSelect" style="color: #1e3a8a; font-size:14px;">▼ 上段エリアの表示内容</label>
      <select id="upperTypeSelect" onchange="toggleUpperInputs()">
        <option value="table">予定表を表示する</option>
        <option value="column">フリーコラム（トピックス）を表示する</option>
      </select>
      
      <div id="upperTableInputs">
        <label for="upperTitleInput">見出し</label>
        <input id="upperTitleInput" value="来週の予定">
        <label for="upperWeekSelect">対象の週</label>
        <select id="upperWeekSelect" onchange="loadWeeks()"></select>
      </div>
      
      <div id="upperColumnInputs" class="hidden-input">
        <label for="upperColTitleInput">コラム題</label>
        <input id="upperColTitleInput" value="上段の特設コラム">
        <label for="upperColBodyInput">コラム本文</label>
        <textarea id="upperColBodyInput">上段をコラムに変更しました。</textarea>
        
        <!-- 【新規】上段トピックス用写真設定 -->
        <div style="margin-top: 10px;">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" id="upperHasPhotoInput" style="width: auto; cursor: pointer;" onchange="toggleUpperPhotoSettings()"> 写真を載せる
          </label>
          <div id="upperPhotoSettings" class="sub-panel-box hidden-input">
            <label for="upperPhotoInput">トピックス写真</label>
            <input type="file" id="upperPhotoInput" accept="image/*">
            <button type="button" class="photoRemoveBtn" onclick="removeUpperPhoto()">写真を外す</button>
            <label for="upperPhotoCaptionInput">キャプション</label>
            <input id="upperPhotoCaptionInput" value="" placeholder="例：理科の実験（6/1）">
            <label>トピックス写真の調整</label>
            <input type="range" id="upperZoomRange" min="1" max="3" step="0.05" value="1">
            <input type="range" id="upperXPosRange" min="-150" max="150" step="1" value="0">
            <input type="range" id="upperYPosRange" min="-150" max="150" step="1" value="0">
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <label for="lowerTypeSelect" style="color: #1e3a8a; font-size:14px;">▼ 下段エリアの表示内容</label>
      <select id="lowerTypeSelect" onchange="toggleLowerInputs()">
        <option value="table">予定表を表示する</option>
        <option value="column">フリーコラムを表示する</option>
      </select>
      
      <div id="lowerTableInputs">
        <label for="lowerTitleInput">見出し</label>
        <input id="lowerTitleInput" value="再来週の予定">
        <label for="lowerWeekSelect">対象の週</label>
        <select id="lowerWeekSelect" onchange="loadWeeks()"></select>
      </div>
      
      <div id="lowerColumnInputs" class="hidden-input">
        <label for="lowerColTitleInput">コラム題</label>
        <input id="lowerColTitleInput" value="下段の特設コラム">
        <label for="lowerColBodyInput">コラム本文</label>
        <textarea id="lowerColBodyInput">下段エリアをコラムスペースとして活用します。</textarea>
      </div>
    </div>
    
    <div class="panel">
      <label for="noticeInput">連絡事項</label>
      <textarea id="noticeInput">習字道具がまだご家庭にある場合は、必ず持ってくるよう声掛けをよろしくお願いします。</textarea>
    </div>

    <!-- 給食当番とQRコード設定 -->
    <div class="panel">
      <label style="color: #1e3a8a; font-size: 14px;">▼ 給食当番設定</label>
      <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; margin-bottom: 12px;">
        <input type="checkbox" id="showLunchDutyInput" checked style="width: auto; cursor: pointer;"> 給食当番を表示する
      </label>

      <hr style="border:0; border-top:1px solid #cbd5e1; margin:14px 0;">

      <label>QRコード1 設定</label>
      <div class="qr-edit-group">
        <input id="qrRenrakuLabelInput" value="連絡帳" placeholder="ラベル名">
        <label><input type="checkbox" id="qrRenrakuShowInput" checked> 表示</label>
      </div>
      <input id="qrRentakuUrl" value="https://docs.google.com/presentation/d/1Jm3TtdwSQcYgjcN1_PHe33_FKxqBKBj-tR83V2Sr_tY/edit" style="margin-top:4px;">

      <label style="margin-top:12px;">QRコード2 設定</label>
      <div class="qr-edit-group">
        <input id="qrHomeworkLabelInput" value="宿題チェック" placeholder="ラベル名">
        <label><input type="checkbox" id="qrHomeworkShowInput" checked> 表示</label>
      </div>
      <input id="qrHomeworkUrl" value="https://script.google.com/a/macros/g.himeji-hyg.ed.jp/s/AKfycby-90miDFjaDz3rwBZTQfAbjy43JbCgIH4wuVSVV-C0WOHYJ91QYcS2wex1WthodGHv/exec" style="margin-top:4px;">
    </div>

    <div class="panel">
      <label for="colorSelect">テーマカラー</label>
      <select id="colorSelect">
        <option value="#1f3a5f,#e8eef7">クラシックネイビー</option>
        <option value="#2e7d32,#e8f5e9">ナチュラルグリーン</option>
        <option value="#c62828,#ffebee">チェリーレッド</option>
        <option value="#ef6c00,#fff3e0">マリーゴールドオレンジ</option>
        <option value="#6a1b9a,#f3e5f5">エレガントパープル</option>
      </select>
    </div>

    <div class="btn-group">
      <button class="saveBtn" onclick="saveToSpreadsheet()">スプレッドシートに一時保存</button>
      <button class="secondaryBtn" onclick="openArchiveModal()">過去の保存を見る</button>
      <button class="printBtn" onclick="window.print()">印刷・保存</button>
    </div>
  </aside>

  <main class="previewWrap">
    <section class="paper">
      <header class="topHeader">
        <div class="titleRow">
          <div class="mainTitle" id="pMainTitle"></div>
          <div class="issue" id="pIssue"></div>
        </div>
        <div class="meta"><span id="pDate"></span> / <span id="pClass"></span></div>
      </header>

      <!-- 今週のひとこまエリア -->
      <div class="columnBox">
        <div class="photoContainer">
          <div class="photoSpace" id="photoPreview"><span class="photoHint">写真スペース</span></div>
          <div class="photoCaption" id="pPhotoCaption"></div>
        </div>
        
        <div class="columnText">
          <h2 id="pColumnTitle"></h2>
          <p id="pColumnBody"></p>
        </div>
      </div>

      <!-- 上段（トピックスまたは予定表）エリア -->
      <div id="pUpperWrapper" style="display: flex; flex-direction: column; margin-bottom: 4px;"></div>

      <div class="sectionTitle">連絡事項</div>
      <div class="noticeBox">
        <ul class="noticeList" id="pNoticeList"></ul>
      </div>

      <div class="bottom-layout">
        <div class="bottom-left-table" id="pLowerWrapper"></div>
        
        <div class="bottom-right-panel">
          <div class="duty-box" id="pDutyBox">
            <div class="duty-title">今週の給食当番</div>
            <div class="duty-value" id="pLunchDuty">未設定</div>
          </div>
          
          <div class="qr-container" id="pQrContainer">
            <div class="qr-block" id="pQrRenrakuBlock">
              <div class="qr-label" id="pQrRenrakuLabel">連絡帳</div>
              <div class="qr-code" id="qrRenrakuImg"></div>
            </div>
            <div class="qr-block" id="pQrHomeworkBlock">
              <div class="qr-label" id="pQrHomeworkLabel">宿題チェック</div>
              <div class="qr-code" id="qrHomeworkImg"></div>
            </div>
            <div class="qr-note" id="pQrNote">※学校用Googleアカウントが必要です</div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="archiveModal" class="archiveModal" role="dialog" aria-modal="true" aria-labelledby="archiveTitle" onclick="if(event.target===this) closeArchiveModal()">
  <div class="archiveDialog">
    <div class="archiveHeader">
      <h2 id="archiveTitle">学級通信の過去の保存</h2>
      <button class="archiveClose" onclick="closeArchiveModal()" aria-label="閉じる">×</button>
    </div>
    <div id="archiveList">読み込み中...</div>
  </div>
</div>

function buildTableHTML(tableId) {
  return `
    <table id="${tableId}">
      <thead><tr class="date-header"></tr></thead>
      <tbody></tbody>
    </table>`;
}

function fillWeekTable(tableId, data, showHomework) {
  const table = document.getElementById(tableId);
  if (!table || !data || !data.dates) return;
  const tbody = table.querySelector("tbody");
  tbody.innerHTML = "";
  
  const headerTr = table.querySelector(".date-header");
  let headerHtml = `<th class="row-label">曜 日</th>`;
  for(let i = 0; i < 7; i++) {
    const isHoliday = data.isHoliday && data.isHoliday[i];
    headerHtml += `<th${isHoliday ? ' class="holiday-col"' : ''}>${data.dates[i] || ""}</th>`;
  }
  headerTr.innerHTML = headerHtml;

  const rows = [
    { label: "行事等", key: "event", baseClass: "event-cell" },
    { label: "1", key: "p1", baseClass: "period-cell" }, 
    { label: "2", key: "p2", baseClass: "period-cell" },
    { label: "3", key: "p3", baseClass: "period-cell" }, 
    { label: "4", key: "p4", baseClass: "period-cell" },
    { label: "5", key: "p5", baseClass: "period-cell" }, 
    { label: "6", key: "p6", baseClass: "period-cell" },
    { label: "下校", key: "dismissal", baseClass: "dismissal-cell" }
  ];
  if (showHomework) rows.push({ label: "宿題", key: "homework", baseClass: "homework-cell" });

  rows.forEach(row => {
    const tr = document.createElement("tr");
    let tds = `<td class="row-label">${row.label}</td>`;
    for (let i = 0; i < 7; i++) {
      let val = data[row.key] ? data[row.key][i] : "";
      const isHoliday = data.isHoliday && data.isHoliday[i];
      const isSuiei = val && String(val).includes("水泳");
      
      let classes = [];
      if (isHoliday) {
        classes.push("holiday-col");
      } else {
        if (row.baseClass) classes.push(row.baseClass);
        if (isSuiei) classes.push("suiei-highlight");
      }
      const classAttr = classes.length > 0 ? ` class="${classes.join(' ')}"` : '';
      if (row.key === 'event' && val && !isHoliday) {
        tds += `<td${classAttr}><span class="event-text">${val}</span></td>`;
      } else {
        tds += `<td${classAttr}>${isHoliday ? "" : (val || "")}</td>`;
      }
    }
    tr.innerHTML = tds;
    tbody.appendChild(tr);
  });
}

function adjustEventFontSize() {
  const elements = document.querySelectorAll('.event-cell');
  elements.forEach(cell => {
    const textSpan = cell.querySelector('.event-text');
    if (!textSpan) return;
    textSpan.style.fontSize = '13px';
    textSpan.style.display = 'inline-block';
    const cellWidth = cell.clientWidth - 4; 
    const textWidth = textSpan.scrollWidth;
    if (textWidth > cellWidth && cellWidth > 0) {
      const newSize = Math.floor((cellWidth / textWidth) * 13);
      textSpan.style.fontSize = Math.max(7, newSize) + 'px';
    }
  });
}

function compressPhoto(file) {
  return new Promise((resolve, reject) => {
    if (!file || !String(file.type).startsWith('image/')) return reject(new Error('画像ファイルを選んでください。'));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('写真を読み込めませんでした。'));
    reader.onload = event => {
      const img = new Image();
      img.onerror = () => reject(new Error('この写真形式は読み込めません。'));
      img.onload = () => {
        const maxSide = 1400;
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', .82));
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });
}

}

function renderArchiveList(items) {
  const list = document.getElementById('archiveList');
  if (!items || !items.length) { list.textContent = 'まだ保存履歴はありません。学級通信を保存すると、ここへ自動追加されます。'; return; }
  list.innerHTML = items.map(item => `<div class="archiveItem"><div><strong>${escapeArchiveText(item.issue || '号数未設定')}　${escapeArchiveText(item.title)}</strong><div class="archiveMeta">保存：${escapeArchiveText(item.savedAt)} ／ 発行日：${escapeArchiveText(item.issueDate)} ／ 第${escapeArchiveText(item.upperWeek)}週・第${escapeArchiveText(item.lowerWeek)}週</div></div><button class="archiveLoadBtn" onclick="loadArchiveItem('${escapeArchiveText(item.id)}')">表示</button></div>`).join('');
}

function loadArchiveItem(id) {
  if (!confirm('現在の画面を、この保存時点の内容に置き換えますか？\n（保存ボタンを押すまではスプレッドシートへ反映されません）')) return;
  const list = document.getElementById('archiveList');
  list.textContent = '過去の学級通信を読み込み中...';
  google.script.run.withSuccessHandler(bundle => {
    applyTsushinForm(bundle.form || {});
    applyLoadedPhotos(bundle.photos || {}, true);
    const upperWeek = Number(document.getElementById('upperWeekSelect').value);
    const lowerWeek = Number(document.getElementById('lowerWeekSelect').value);
    if (bundle.plans) {
      nextWeekData = bundle.plans[String(upperWeek)] || {};
      followingWeekData = bundle.plans[String(lowerWeek)] || {};
      render(); closeArchiveModal(); return;
    }
    google.script.run.withSuccessHandler(plans => {
      nextWeekData = plans[String(upperWeek)] || {};
      followingWeekData = plans[String(lowerWeek)] || {};
      render(); closeArchiveModal();
    }).getWeekPlans([upperWeek, lowerWeek]);
  }).withFailureHandler(error => {
    list.textContent = '保存履歴を表示できませんでした：' + (error && error.message ? error.message : error);
  }).loadTsushinArchive(id);
}

// 各調整スライダーのイベント紐付け
["zoomRange", "xPosRange", "yPosRange"].forEach(id => document.getElementById(id).addEventListener("input", updatePhotoTransform));
["upperZoomRange", "upperXPosRange", "upperYPosRange"].forEach(id => {
  document.getElementById(id).addEventListener("input", updateUpperPhotoTransform);
});

[
  "mainTitleInput", "issueInput", "dateInput", "classInput", "columnTitle", "columnBody", 
  "noticeInput", "qrRentakuUrl", "qrHomeworkUrl", "upperTitleInput", "upperColTitleInput",

document.getElementById("colorSelect").addEventListener("change", changeThemeColor);

initWeekSelects();
changeThemeColor();
loadFromSpreadsheet();
