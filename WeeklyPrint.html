<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* 1. 全体共通設定 */
    * { box-sizing: border-box; }
    
    /* 🌟 印刷時はブラウザ側の標準余白をゼロにし、CSS側で完全制御します */
    @page { 
      size: A4 portrait; 
      margin: 0; 
    }
    
    html, body { 
      margin: 0; 
      padding: 0; 
      background: #f1f5f9; 
      font-family: 'BIZ UDPGothic', sans-serif; 
      color: #1e293b; 
    }
    
    /* ==========================================================
       【アプリ画面表示用の設定】
       ========================================================== */
    .print-container { 
      display: flex; 
      flex-direction: column; 
      min-height: 100vh;
      max-width: 210mm;
      margin: 10px auto 40px auto; 
      background: white; 
      padding: 15px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }
    .weeks-grid { display: grid; grid-template-columns: minmax(0, 210mm); justify-content: center; gap: 18px; width: 100%; }
    .weeks-grid.two-weeks { grid-template-columns: repeat(2, 210mm); justify-content: start; width: max-content; padding: 0 18px; margin: 0 auto 40px; }
    .weeks-grid.two-weeks .print-container { margin-left: 0; margin-right: 0; }
    
    /* 操作バー */
    .no-print-bar {
      background: #1e293b; color: white; padding: 10px 20px; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); height: 45px; position: sticky; top:0; z-index:100;
    }
    .no-print-bar select { padding: 5px; border-radius: 4px; border: none; font-weight: bold; font-size: 13px; background: white; font-family: inherit; }
    .btn { border: none; padding: 5px 10px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; font-family: inherit; white-space: nowrap; }
    
    /* ボタン色設定 */
    .btn-print { background: #38bdf8; color: #0f172a; }
    .btn-save { background: #10b981; color: white; margin-left: auto; }
    .btn-save:disabled { background: #64748b; color: #cbd5e1; cursor: not-allowed; opacity: 0.6; }
    
    .btn-load-default { background: #f59e0b; color: white; }
    .btn-open-modal { background: #a855f7; color: white; }
    .btn-update-slide { background: #6366f1; color: white; } 
    .btn-open-slide { background: #06b6d4; color: white; } 
    .btn-tools { background:#0f766e; color:white; }
    .draft-status { font-size:10px; color:#cbd5e1; min-width:92px; }
    
    .btn-nav { background: #475569; color: white; padding: 5px 10px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; font-family: inherit; }
    .btn-nav:hover { background: #64748b; }
    .ipad-only { display: none; }

    /* モーダル */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 200; }
    .modal-box { background: white; padding: 20px; border-radius: 8px; width: 320px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); color: #1e293b; }
    .modal-box h3 { margin-top: 0; margin-bottom: 15px; font-size: 14px; border-bottom: 2px solid #a855f7; padding-bottom: 5px; }
    .modal-field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
    .modal-field label { font-size: 11px; font-weight: bold; color: #475569; }
    .modal-field input[type="date"], .modal-field input[type="text"], .modal-field select { padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; width: 100%; font-family: inherit; }
    .modal-buttons { display: flex; gap: 8px; margin-top: 15px; justify-content: flex-end; }
    .btn-modal-close { background: #64748b; color: white; }
    .btn-modal-submit { background: #a855f7; color: white; }

    /* メインテーブル */
    .header-table { width: 100%; margin-bottom: 10px; border-collapse: collapse; }
    .header-center { font-size: 18px; font-weight: bold; text-align: center; letter-spacing: 6px; border-bottom: 2px solid #1e293b; padding-bottom: 4px; }
    .main-table { width: 100%; border-collapse: collapse; table-layout: fixed; flex-grow: 1; } /* 🌟 縦に引き伸ばせるよう flex-grow を追加 */
    .main-table th, .main-table td { border: 1px solid #111; padding: 0; font-size: 11px; vertical-align: top; word-break: break-all; position: relative; }
    .col-label { width: 8%; background: #f1f5f9; text-align: center; vertical-align: middle; font-weight: bold; font-size: 11px; }
    .day-header { background: #e2e8f0; text-align: center; font-weight: bold; padding: 6px 0; font-size: 11px; }
    .week-settings-bar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin: -2px 0 8px; color: #334155; font-size: 12px; font-weight: bold; }
    .week-settings-bar select { width: auto; min-width: 86px; padding: 6px 28px 6px 9px; border: 1px solid #94a3b8; border-radius: 6px; background: #fff; font: inherit; }
    .event-register-cell { cursor: pointer; padding-right: 24px !important; }
    .event-add-button { position: absolute; top: 3px; right: 3px; z-index: 2; width: 20px; height: 20px; padding: 0; border: 1px solid #7e22ce; border-radius: 50%; background: #fff; color: #7e22ce; font-weight: bold; line-height: 18px; cursor: pointer; }
    .event-add-button:hover { background: #f3e8ff; }
    
    .period-row { min-height: 90px; height: auto; } 
    .period-row td { height: 90px; }
    .row-break { background: #f8fafc; font-weight: bold; color: #475569; height: 26px; text-align: center; }
    .row-short { min-height: 32px; height: auto; }
    .row-homework { min-height: 90px; height: auto; }
    .row-homework td { height: 90px; } 
    .row-memo { min-height: 130px; height: auto; } 
    .row-memo td { height: 130px; }

    .cell-box { display: flex; flex-direction: column; height: 100%; width: 100%; overflow: hidden; }
    .subject-combo-container { display: flex; width: 100%; border-bottom: 1px dashed #cbd5e1; background: #fff; position: relative; }
    .subject-input { flex-grow: 1; border: none; font-weight: bold; text-align: center; font-size: 11px; padding: 3px 1px; width: 70%; background: transparent; font-family: inherit; }
    .subject-select { width: 20px; border: none; background: #f1f5f9; cursor: pointer; color: #475569; font-size: 10px; text-align: center; padding:0; }
    .edit-trigger { width: 100%; height: 100%; border: none; padding: 5px; font-size: 11px; font-family: inherit; resize: none; line-height: 1.35; background: transparent; display: block; overflow: hidden; }
    .center-input { text-align: center; vertical-align: middle; }
    .left-input { text-align: left; }

    /* 教科別パステルカラー */
    .bg-sub-0 { background-color: #fee2e2 !important; color: #991b1b; } 
    .bg-sub-1 { background-color: #e0f2fe !important; color: #0369a1; } 
    .bg-sub-2 { background-color: #f0fdf4 !important; color: #166534; } 
    .bg-sub-3 { background-color: #fef9c3 !important; color: #854d0e; } 
    .bg-sub-4 { background-color: #fae8ff !important; color: #86198f; } 
    .bg-sub-5 { background-color: #ffedd5 !important; color: #9a3412; } 
    .bg-sub-6 { background-color: #e0e7ff !important; color: #3730a3; } 
    .bg-sub-7 { background-color: #ecfdf5 !important; color: #065f46; } 
    .bg-sub-8 { background-color: #fff1f2 !important; color: #9f1239; } 
    .bg-sub-9 { background-color: #f1f5f9 !important; color: #334155; } 

    /* 休日列 */
    .holiday-column,
    .holiday-column .cell-box,
    .holiday-column .subject-combo-container,
    .holiday-column .edit-trigger,
    .holiday-column .subject-input,
    .holiday-column .subject-select {
      background-color: #cbd5e1 !important;
      color: #64748b !important; 
      cursor: not-allowed;
    }
    #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold; color: #1e293b; font-size: 14px; background: rgba(255,255,255,0.9); padding: 10px 20px; border-radius: 8px; border: 1px solid #cbd5e1; z-index: 1000; }

    /* ==========================================================
       【印刷時専用設定】
       ========================================================== */
    @media print {
      .no-print-bar, .modal-overlay, .screen-only { display: none !important; }
      html, body { background: white; margin: 0; padding: 0; height: auto; overflow: visible !important; font-family: 'BIZ UDPGothic', sans-serif !important; }
      .weeks-grid, .weeks-grid.two-weeks { display: block !important; width: auto !important; margin: 0 !important; padding: 0 !important; }
      
      /* 🌟 固定値(255mm)を廃止。用紙の全高（100vh）に合わせてきれいに収め、周囲に適切な余白を確保します */
      .print-container { 
        margin: 0 !important; 
        padding: 8mm 10mm 10mm 10mm !important; /* 上・右・下・左の印刷余白を設定 */
        width: 100vw !important; 
        height: 100vh !important; 
        box-shadow: none; 
        overflow: hidden !important; 
        display: flex !important;
        flex-direction: column !important;
        break-after: page;
        page-break-after: always;
      }
      .print-container:last-child { break-after: auto; page-break-after: auto; }
      
      /* 🌟 テーブル要素が縦幅いっぱいに引き伸ばされるように指定 */
      .main-table {
        height: 100% !important;
      }
      
      .main-table th, .main-table td { font-size: 8.5px !important; }
      .edit-trigger { font-size: 8.5px !important; padding: 1px 2px; line-height: 1.15; overflow: hidden !important; }
      
      /* 🌟 パーセンテージや固定の高さを解除し、テーブルの自動伸長(ブラウザの自動配分)に任せます */
      .period-row, .period-row td,
      .row-homework, .row-homework td,
      .row-memo, .row-memo td { 
        height: auto !important; 
        min-height: 0 !important; 
      }
      
      .subject-select { display: none; }
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    @media (max-width: 760px) {
      .no-print-bar { height:auto; flex-wrap:wrap; padding:8px; }
      .no-print-bar .btn { flex:1 1 42%; justify-content:center; min-height:38px; }
      .draft-status { width:100%; text-align:center; }
      .print-container { margin:0; padding:5px; min-width:720px; }
      body { overflow-x:auto; }
    }

    /* iPad・タブレット専用表示。印刷時は下の @media print が優先される。 */
    body.ipad-ui { overflow-x: hidden; padding-bottom: env(safe-area-inset-bottom); }
    body.ipad-ui .ipad-only { display: flex; }
    body.ipad-ui .no-print-bar { height: auto; min-height: 58px; flex-wrap: wrap; padding: calc(8px + env(safe-area-inset-top)) 10px 8px; gap: 8px; }
    body.ipad-ui .no-print-bar .btn, body.ipad-ui .btn-nav, body.ipad-ui .no-print-bar select { min-height: 44px; font-size: 14px; border-radius: 9px; }
    body.ipad-ui .no-print-bar .btn { flex: 0 0 auto; }
    body.ipad-ui .app-title { font-size: 15px; font-weight: bold; margin-right: 2px; }
    body.ipad-ui .ipad-extra { display: none; }
    body.ipad-ui.tools-open .ipad-extra { display: inline-flex; flex: 1 1 30%; justify-content: center; }
    body.ipad-ui #btnOpenSlide.ipad-extra { display: none; }
    body.ipad-ui.tools-open #btnOpenSlide.ipad-extra { display: inline-flex; }
    body.ipad-ui .btn-save { margin-left: auto; min-width: 94px; justify-content: center; }
    body.ipad-ui .draft-status { order: 3; width: 100%; min-width: 0; text-align: right; padding-right: 4px; }
    body.ipad-ui .ipad-day-nav { order: 4; width: 100%; gap: 5px; overflow-x: auto; padding: 4px 0 1px; }
    body.ipad-ui .ipad-day-button { flex: 1 0 76px; min-height: 50px; border: 1px solid #64748b; border-radius: 10px; background: #334155; color: #fff; font-family: inherit; font-weight: bold; }
    body.ipad-ui .ipad-day-button small { display: block; margin-top: 2px; font-size: 10px; font-weight: normal; color: #cbd5e1; }
    body.ipad-ui .ipad-day-button.active { background: #2563eb; border-color: #93c5fd; box-shadow: inset 0 0 0 2px #bfdbfe; }
    body.ipad-ui .weeks-grid, body.ipad-ui .weeks-grid.two-weeks { display: block; width: 100%; margin: 0; padding: 0; }
    body.ipad-ui .print-container { width: 100%; max-width: none; min-width: 0; margin: 0 0 14px; padding: 12px; box-shadow: none; border-bottom: 5px solid #cbd5e1; }
    body.ipad-ui .header-table { margin: 4px 0 10px; }
    body.ipad-ui .main-table { table-layout: fixed; }
    body.ipad-ui .main-table .day-col { display: none; }
    body.ipad-ui .main-table .day-col.ipad-active-day { display: table-cell; width: auto; }
    body.ipad-ui .col-label { width: 78px; min-width: 78px; font-size: 14px; vertical-align: middle; }
    body.ipad-ui .day-header { height: 48px; font-size: 15px; }
    body.ipad-ui .period-row td { height: 116px; }
    body.ipad-ui .row-homework td { height: 120px; }
    body.ipad-ui .row-memo td { height: 150px; }
    body.ipad-ui .row-short td, body.ipad-ui .row-break td { height: 58px; }
    body.ipad-ui .subject-input, body.ipad-ui .edit-trigger { font-size: 16px !important; padding: 8px; line-height: 1.45; }
    body.ipad-ui .subject-combo-container { min-height: 44px; }
    body.ipad-ui .subject-select { width: 48px; min-width: 48px; font-size: 16px; }
    body.ipad-ui .modal-box { width: min(92vw, 520px) !important; max-height: 86vh; overflow-y: auto; border-radius: 14px; }
    body.ipad-ui .modal-field input, body.ipad-ui .modal-field select, body.ipad-ui .modal-buttons .btn { min-height: 44px; font-size: 16px; }

    @media print {
      body.ipad-ui .main-table .day-col { display: table-cell !important; }
      body.ipad-ui .main-table th, body.ipad-ui .main-table td,
      body.ipad-ui .col-label, body.ipad-ui .day-header { font-size: 8.5px !important; }
      body.ipad-ui .subject-input, body.ipad-ui .edit-trigger { font-size: 8.5px !important; padding: 1px 2px !important; line-height: 1.15 !important; }
      body.ipad-ui .subject-combo-container { min-height: 0 !important; }
      body.ipad-ui .subject-select { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="no-print-bar">
    <span class="app-title">週案Web</span>
    
    <button class="btn-nav" onclick="changeWeek(-1)">◀</button>
    <select id="weekSelect" onchange="handleWeekSelectChange(this.value)">
      <script>for(let i=1;i<=52;i++) document.write(`<option value="${i}">第 ${i} 週</option>`);</script>
    </select>
    <button class="btn-nav" onclick="changeWeek(1)">▶</button>
    <select id="weekDisplayCount" onchange="changeWeekDisplay(this.value)" aria-label="表示する週数">
      <option value="1">1週間</option>
      <option value="2">2週間</option>
    </select>
    
    <button class="btn btn-tools ipad-only" id="ipadToolsToggle" onclick="toggleIpadTools()">☰ 操作</button>
    <button class="btn btn-load-default ipad-extra" onclick="applyDefaultTimetable()">📅 基本時間割読込</button>
    <button class="btn btn-tools ipad-extra" onclick="openTimetableTool()">🔁 時間割変更</button>
    <button class="btn btn-tools ipad-extra" onclick="copyPreviousWeek()">📋 前週から作成</button>
    <button class="btn btn-tools ipad-extra" onclick="insertQuickPhrase()">✍️ 定型文</button>
    <button class="btn btn-open-modal ipad-extra" onclick="openRegModal()">✨ 休日・行事登録</button>
    <button class="btn btn-update-slide ipad-extra" onclick="executeSlideUpdate()">🖼️ スライド更新</button>
    
    <button class="btn ipad-extra" id="btnOpenSlide" style="background: #e2e8f0; color: #94a3b8; cursor: not-allowed;" onclick="openLatestSlide()" disabled>🔗 スライドを開く</button>
    
    <button class="btn btn-print ipad-extra" onclick="window.print()">🖨️ 印刷</button>
    <button class="btn btn-save" id="btnSave" onclick="saveToSpreadsheet()" disabled>💾 保存</button>
    <span class="draft-status" id="draftStatus">下書き待機中</span>
    <div class="ipad-day-nav ipad-only" id="ipadDayNav">
      <button class="ipad-day-button active" data-day="0" onclick="setIpadDay(0)">月<small></small></button>
      <button class="ipad-day-button" data-day="1" onclick="setIpadDay(1)">火<small></small></button>
      <button class="ipad-day-button" data-day="2" onclick="setIpadDay(2)">水<small></small></button>
      <button class="ipad-day-button" data-day="3" onclick="setIpadDay(3)">木<small></small></button>
      <button class="ipad-day-button" data-day="4" onclick="setIpadDay(4)">金<small></small></button>
      <button class="ipad-day-button" data-day="5" onclick="setIpadDay(5)">土<small></small></button>
      <button class="ipad-day-button" data-day="6" onclick="setIpadDay(6)">日<small></small></button>
    </div>
  </div>

  <div class="modal-overlay" id="timetableModal" style="display:none;">
    <div class="modal-box" style="width:380px;">
      <h3>時間割をまとめて変更</h3>
      <div class="modal-field"><label>登録パターン（任意）</label><select id="toolPattern" onchange="loadSelectedPattern()"><option value="">手動で指定</option></select></div>
      <div class="modal-field"><label>変更する日</label><select id="toolTargetDay"><option value="0">月</option><option value="1">火</option><option value="2">水</option><option value="3">木</option><option value="4">金</option></select></div>
      <div class="modal-field"><label>使う基本時間割</label><select id="toolSourceDay"><option value="0">月曜時間割</option><option value="1">火曜時間割</option><option value="2">水曜時間割</option><option value="3">木曜時間割</option><option value="4">金曜時間割</option></select></div>
      <div class="row" style="display:flex;gap:8px;"><div class="modal-field" style="flex:1"><label>元の開始</label><select id="toolSourceStart"></select></div><div class="modal-field" style="flex:1"><label>元の終了</label><select id="toolSourceEnd"></select></div><div class="modal-field" style="flex:1"><label>入れる先</label><select id="toolTargetStart"></select></div></div>
      <label style="font-size:11px"><input type="checkbox" id="toolOverwrite" checked style="width:auto"> すでに入力済みの教科も上書きする</label>
      <div class="modal-buttons"><button class="btn btn-modal-close" onclick="closeTimetableTool()">キャンセル</button><button class="btn btn-modal-submit" onclick="applyTimetableTool()">反映</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="regModal" style="display: none;">
    <div class="modal-box">
      <h3>行事・休日の新規登録</h3>
      <div class="modal-field">
        <label>登録種別</label>
        <select id="regType">
          <option value="event">行事 (F・G列へ)</option>
          <option value="holiday">休日 (H・I列へ)</option>
        </select>
      </div>
      <div class="modal-field">
        <label>日付選択</label>
        <input type="date" id="regDate">
      </div>
      <div class="modal-field">
        <label>名称</label>
        <input type="text" id="regName" placeholder="例：創立記念日など">
      </div>
      <div class="modal-buttons">
        <button class="btn btn-modal-close" onclick="closeRegModal()">キャンセル</button>
        <button class="btn btn-modal-submit" onclick="submitConfigReg()">シートに登録</button>
      </div>
    </div>
  </div>

  <div id="loading">データを読み込み中...</div>

  <div id="contentArea" style="display:none;">
    <div class="weeks-grid" id="weeksContainer"></div>
  </div>

  <script>
    let globalConfigList = [];
    let currentLoadedWeek = 1;
    let displayedWeeks = [];
    let displayWeekCount = localStorage.getItem('shuan_week_display_count') === '2' ? 2 : 1;
    let globalSlideUrl = ""; 
    
    let isDirty = false;
    let productivitySettings = {patterns:[], phrases:[]};
    let draftTimer = null;
    let lastEditableElement = null;
    let pendingEventFormSnapshot = null;
    let ipadDay = (function(){ const d=new Date().getDay(); return d===0 ? 6 : d-1; })();

    function shouldUseIpadUi() {
      const isiPad = /iPad/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      return isiPad || (navigator.maxTouchPoints > 1 && window.innerWidth <= 1400);
    }

    function applyIpadMode() {
      document.body.classList.toggle('ipad-ui', shouldUseIpadUi());
      if (document.body.classList.contains('ipad-ui')) setIpadDay(ipadDay, false);
    }

    function toggleIpadTools() {
      document.body.classList.toggle('tools-open');
      document.getElementById('ipadToolsToggle').textContent = document.body.classList.contains('tools-open') ? '× 閉じる' : '☰ 操作';
    }

    function setIpadDay(day, scrollToTop) {
      ipadDay = Math.max(0, Math.min(6, Number(day) || 0));
      document.body.dataset.ipadDay = String(ipadDay);
      document.querySelectorAll('.ipad-day-button').forEach(function(button) {
        button.classList.toggle('active', Number(button.dataset.day) === ipadDay);
      });
      document.querySelectorAll('.day-col').forEach(function(cell) {
        cell.classList.toggle('ipad-active-day', Number(cell.dataset.localDay) === ipadDay);
      });
      if (scrollToTop !== false) {
        const area = document.getElementById('contentArea');
        if (area) area.scrollIntoView({behavior:'smooth', block:'start'});
      }
    }

    function updateIpadDayLabels() {
      document.querySelectorAll('.ipad-day-button').forEach(function(button) {
        const small = button.querySelector('small');
        if (!small) return;
        const day = Number(button.dataset.day);
        small.textContent = displayedWeeks.map(function(week) {
          return String((week.days || [])[day] || '').replace(/\([^)]*\)/g,'');
        }).filter(Boolean).join('・');
      });
    }

    function changeWeekDisplay(value) {
      const nextCount = Number(value) === 2 ? 2 : 1;
      if (nextCount === displayWeekCount) return;
      if (!confirmDiscardChanges()) {
        document.getElementById('weekDisplayCount').value = String(displayWeekCount);
        return;
      }
      displayWeekCount = nextCount;
      localStorage.setItem('shuan_week_display_count',String(displayWeekCount));
      if (displayWeekCount === 2 && currentLoadedWeek > 51) currentLoadedWeek = 51;
      document.getElementById('weekSelect').value = String(currentLoadedWeek);
      loadWeeklyData(currentLoadedWeek);
    }

    function setDirty(dirty) {

      document.getElementById('btnSave').disabled = !dirty;
    }

    function confirmDiscardChanges() {
      if (isDirty) {
        return confirm("編集中のデータが保存されていません。移動してよろしいですか？");
      }
      return true;
    }

    function adjustFontSize(el) {
      if (!el) return;
      let baseSize = window.matchMedia('print').matches ? 8.5 : 11;
      el.style.fontSize = baseSize + 'px';
      let count = 0;
      while ((el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth) && baseSize > 6 && count < 10) {
        baseSize -= 0.5;
        el.style.fontSize = baseSize + 'px';
        count++;
      }
    }

    function triggerAllFontAdjustments() {
      setTimeout(() => {
        const elements = document.querySelectorAll('.edit-trigger, .subject-input');
        elements.forEach(el => adjustFontSize(el));
      }, 50);
    }

   function executeSlideUpdate() {

  document.getElementById('btn-slide-cancel').onclick = () => document.body.removeChild(overlay);

  // 実際のGAS呼び出し処理

    function escapeWeekly(value) {

      });
    }

            body += `<td ${dayAttrs(i)}><input type="text" id="${prefix}-${period.id}-${i}" class="edit-trigger center-input" value="${escapeWeekly(period.data[i])}" oninput="adjustFontSize(this)" ${disabled(i)}></td>`;
          } else {

          }
        }

      body += '<tr class="row-short"><td class="col-label">下校</td>';
      for(let i=0;i<7;i++) body += `<td ${dayAttrs(i)}><div class="subject-combo-container" style="border-bottom:none;height:100%;"><input type="text" id="${prefix}-leaving-${i}" class="subject-input edit-trigger center-input" value="${escapeWeekly(t.leaving[i])}" oninput="adjustFontSize(this)" ${disabled(i)} style="font-weight:bold;padding:4px 2px;"><select class="subject-select" onchange="onSubjectSelectChange(this)" ${disabled(i)}>${leavingOptions}</select></div></td>`;
      body += '</tr><tr class="row-homework"><td class="col-label">宿題</td>';
      for(let i=0;i<7;i++) body += `<td ${dayAttrs(i)}><textarea id="${prefix}-homework-${i}" class="edit-trigger left-input" oninput="adjustFontSize(this)" ${disabled(i)}></textarea></td>`;

    function renderLoadedWeeks(payload) {
      if (payload && payload.error) { alert(payload.error); document.getElementById('loading').style.display='none'; return; }
      displayedWeeks = payload.weeks || (payload.weekly ? [payload.weekly] : []);
      if (!displayedWeeks.length || displayedWeeks.some(function(week){return !week || week.error;})) {
        alert('週案データを読み込めませんでした。'); document.getElementById('loading').style.display='none'; return;
      }
      globalConfigList = displayedWeeks[0].colorSubjects || [];
      const container = document.getElementById('weeksContainer');
      container.className = 'weeks-grid' + (displayedWeeks.length === 2 ? ' two-weeks' : '');
      container.innerHTML = displayedWeeks.map(buildWeekPanel).join('');
      displayedWeeks.forEach(function(week) {
        const prefix = weekPrefix(week.weekNum), t = week.timetable;
        for(let i=0;i<7;i++) {
          document.getElementById(`${prefix}-homework-${i}`).value = t.homework[i] || '';
          document.getElementById(`${prefix}-memo-${i}`).value = t.memo[i] || '';
          ['p1','p2','p3','p4','p5','p6'].forEach(function(p){document.getElementById(`${prefix}-${p}-cont-${i}`).value=(t[p][i]&&t[p][i].content)||'';});
        }
      });
      document.getElementById('loading').style.display='none';
      document.getElementById('contentArea').style.display='block';
      updateIpadDayLabels(); setIpadDay(ipadDay,false); triggerAllFontAdjustments(); setDirty(false);
      if (pendingEventFormSnapshot) {
        const snapshot = pendingEventFormSnapshot;
        pendingEventFormSnapshot = null;
        snapshot.forEach(function(item){ fillWeeklyForm(item.data,{},item.weekNum); });
      } else {
        offerDraftRestore(currentLoadedWeek,payload.draft);
      }
    }

    function loadWeeklyData(weekNum, prepared) {
      currentLoadedWeek = parseInt(weekNum,10);
      document.getElementById('loading').style.display='block';
      document.getElementById('contentArea').style.display='none';
      if (prepared) renderLoadedWeeks(prepared);
      else google.script.run.withSuccessHandler(renderLoadedWeeks).withFailureHandler(function(err){
        document.getElementById('loading').innerText='読み込みに失敗しました: '+(err.message||err);
      }).getWeeklyPageDataRange(currentLoadedWeek,displayWeekCount);
    }

    function collectWeeklyFormData(weekNum) {
      const prefix=weekPrefix(weekNum);
      const single=id=>Array.from({length:7},(_,i)=>document.getElementById(`${prefix}-${id}-${i}`).value);
      const split=id=>Array.from({length:7},(_,i)=>({subject:document.getElementById(`${prefix}-${id}-sub-${i}`).value,content:document.getElementById(`${prefix}-${id}-cont-${i}`).value}));
      return {lunchDuty:document.getElementById(`${prefix}-lunch-duty`).value,morning:single('morning'),p1:split('p1'),p2:split('p2'),rest:single('rest'),p3:split('p3'),p4:split('p4'),lunch:single('lunch'),clean:single('clean'),recess:single('recess'),p5:split('p5'),p6:split('p6'),leaving:single('leaving'),homework:single('homework'),memo:single('memo')};
    }

    function fillWeeklyForm(data, options, weekNum) {
      options=options||{}; weekNum=Number(weekNum)||currentLoadedWeek;
      const prefix=weekPrefix(weekNum), periods=['p1','p2','p3','p4','p5','p6'];
      if (Object.prototype.hasOwnProperty.call(data, 'lunchDuty')) {
        const duty=document.getElementById(`${prefix}-lunch-duty`);
        if(duty)duty.value=data.lunchDuty==='A'||data.lunchDuty==='B'?data.lunchDuty:'';
      }
      ['morning','rest','lunch','clean','recess','leaving','homework','memo'].forEach(function(key){
        if(options.skipNotes&&(key==='homework'||key==='memo'))return;
        for(let i=0;i<7;i++){const el=document.getElementById(`${prefix}-${key}-${i}`);if(el&&!el.disabled)el.value=(data[key]&&data[key][i])||'';}
      });
      periods.forEach(function(key){for(let i=0;i<7;i++){const s=document.getElementById(`${prefix}-${key}-sub-${i}`),c=document.getElementById(`${prefix}-${key}-cont-${i}`);if(s&&!s.disabled){s.value=(data[key]&&data[key][i]&&data[key][i].subject)||'';c.value=(data[key]&&data[key][i]&&data[key][i].content)||'';updateSubjectColor(s);}}});
      triggerAllFontAdjustments();setDirty(true);
    }

    function getActiveWeekNumber() {
      const panel = lastEditableElement && lastEditableElement.closest ? lastEditableElement.closest('.week-panel') : null;
      return panel ? Number(panel.dataset.week) : currentLoadedWeek;

    function openTimetableTool(){ const s=document.getElementById('toolPattern');s.innerHTML='<option value="">手動で指定</option>';(productivitySettings.patterns||[]).forEach(function(p,i){s.add(new Option(p.name||('パターン'+(i+1)),i));});document.getElementById('timetableModal').style.display='flex'; }

    function copyPreviousWeek(){

    function insertQuickPhrase(){
      const current=document.activeElement;

      const items=productivitySettings.phrases||[]; if(!items.length){alert('設定ページで定型文を登録してください。');return;}
      const menu=items.map((x,i)=>(i+1)+'：'+x.name).join('\n'); const n=Number(prompt('入れる定型文の番号を入力してください。\n'+menu));
      if(!n||!items[n-1])return; active.value+=(active.value?'\n':'')+items[n-1].text; lastEditableElement=active; active.focus(); setDirty(true); adjustFontSize(active);
    }

    function validateWeekly(data,weekNum){
      const warnings=[];
      for(let d=0;d<5;d++){
        const subjects=['p1','p2','p3','p4','p5','p6'].map(p=>data[p][d].subject).filter(Boolean);
        if(subjects.length && !data.leaving[d]) warnings.push('第'+weekNum+'週 '+(d+1)+'日目：下校時刻が未入力');
        ['p1','p2','p3','p4','p5','p6'].forEach(p=>{if(data[p][d].subject&&!data[p][d].content) warnings.push('第'+weekNum+'週 '+(d+1)+'日目 '+p.substring(1)+'時間目：学習内容が空欄');});
      }
      return warnings.slice(0,15);
    }

    function draftGroupKey(){ return String(currentLoadedWeek)+(displayWeekCount===2?'_2':''); }
    function draftStorageKey(groupKey){ return 'shuan_weekly_draft_' + groupKey; }
    function saveDraftIfNeeded(localOnly){
      if(!isDirty||!displayedWeeks.length)return;
      const groupKey=draftGroupKey();
      const data={weeks:displayedWeeks.map(function(week){return {weekNum:week.weekNum,data:collectWeeklyFormData(week.weekNum)};})};
      const payload={savedAt:new Date().toISOString(),data:data};
      try{localStorage.setItem(draftStorageKey(groupKey),JSON.stringify(payload));document.getElementById('draftStatus').innerText='端末保存 '+new Date().toLocaleTimeString();}catch(e){}
      if(!localOnly) google.script.run.withSuccessHandler(function(r){if(r&&r.success)document.getElementById('draftStatus').innerText='下書き同期 '+r.savedAt;}).saveWeeklyDraft(groupKey,data);
    }
    function offerDraftRestore(week, serverDraft){
      const groupKey=displayWeekCount===2?String(week)+'_2':String(week);
      let localDraft=null;try{localDraft=JSON.parse(localStorage.getItem(draftStorageKey(groupKey))||'null');}catch(e){}
      const drafts=[localDraft,serverDraft].filter(d=>d&&d.data).sort((a,b)=>new Date(b.savedAt)-new Date(a.savedAt));
      const draft=drafts[0];
      if(!draft||!confirm('この表示には '+new Date(draft.savedAt).toLocaleString()+' の下書きがあります。復元しますか？'))return;
      if(Array.isArray(draft.data.weeks)) {
        draft.data.weeks.forEach(function(item){if(item&&item.data)fillWeeklyForm(item.data,{},item.weekNum);});
      } else {
        fillWeeklyForm(draft.data,{},week);
      }
    }

    function applyDefaultTimetable() {
      if(!confirm("基本時間割を上書きします。よろしいですか？")) return;
      document.getElementById('loading').style.display = 'block';
      const applyDefault = function(defaultTimetable) {
        document.getElementById('loading').style.display = 'none';
        const periods = ["p1", "p2", "p3", "p4", "p5", "p6"];
        displayedWeeks.forEach(function(week) {
          const prefix=weekPrefix(week.weekNum);
          periods.forEach(p => {
            for(let i=0; i<7; i++) {
              const inputEl = document.getElementById(`${prefix}-${p}-sub-${i}`);
              if(inputEl && !inputEl.disabled) { inputEl.value = defaultTimetable[p][i]; updateSubjectColor(inputEl); }
            }
          });
        });
        triggerAllFontAdjustments();
        setDirty(true); 
        alert("基本時間割を展開しました。保存ボタンを押して確定してください。");
      };
      if(productivitySettings.defaultTimetable) applyDefault(productivitySettings.defaultTimetable);
      else google.script.run.withSuccessHandler(applyDefault).getDefaultTimetable();
    }

    function saveToSpreadsheet() {
      document.getElementById('loading').style.display = 'block';
      const items=displayedWeeks.map(function(week){return {weekNum:week.weekNum,colIndices:week.colIndices,data:collectWeeklyFormData(week.weekNum)};});
      const warnings=items.reduce(function(all,item){return all.concat(validateWeekly(item.data,item.weekNum));},[]).slice(0,30);
      if(warnings.length&&!confirm('保存前の確認\n・'+warnings.join('\n・')+'\n\nこのまま保存しますか？')){document.getElementById('loading').style.display='none';return;}
      google.script.run
        .withSuccessHandler(function(result) {
          document.getElementById('loading').style.display = 'none';
          if (!result || result.error) {
            alert(result && result.error ? result.error : "保存結果を確認できませんでした。");
            return;
          }
          alert("保存しました！");
          setDirty(false);
          document.getElementById('draftStatus').innerText='保存済み';
          try{localStorage.removeItem(draftStorageKey(draftGroupKey()));}catch(e){}
        })
        .withFailureHandler(function(err) {
          document.getElementById('loading').style.display = 'none';
          alert("保存に失敗しました: " + (err && err.message ? err.message : err));
        })
        .saveWeeklyDataRange(items);
    }
  </script>
</body>
